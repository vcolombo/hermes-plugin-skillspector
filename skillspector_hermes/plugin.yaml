# Named skillspector_hermes (not skillspector) so the plugin package can never
# shadow the installed `skillspector` distribution it imports at scan time.
name: skillspector_hermes
version: 1.0.0
description: >-
  Security scanner for AI agent extensions, powered by SkillSpector. Scan an
  agent skill (e.g. SKILL.md), MCP server, or agent plugin — delivered as a URL,
  zip, Git repo, or local directory — for vulnerabilities and malicious patterns
  before installing or trusting it, and gate installs on the returned risk
  verdict. Not for general-purpose software: CLI tools and language packages
  (pip/npm/cargo/apt) are out of scope even when installing one. The optional LLM
  semantic pass runs on the host's own model via ctx.llm — no plugin-managed API
  keys. Requires the skillspector Python package installed from Git in the Hermes
  environment (see README).
author: Vincent Colombo
provides_tools:
  - skillspector_scan
provides_hooks:
  - pre_tool_call
optional_config:
  - key: auto_scan
    description: >-
      Opt-in gate (default OFF). When enabled, a pre_tool_call hook scans plugin
      and MCP-server installs the agent runs via `hermes plugins install/update`
      and `hermes mcp add/install`, and — fail-closed — escalates any non-clean
      or failed scan to the human-approval gate. Best-effort defense-in-depth
      only: it scans a mutable ref before Hermes fetches it (TOCTOU), matches a
      single plain `hermes ...` command, and is bypassed by --yolo / cached
      approvals. Skills are out of scope (already guarded by skills_guard). Keys:
      enabled (bool, default false), use_llm (bool, default true),
      scan_timeout_s (int seconds, default 120). Set under
      plugins.entries.skillspector_hermes.auto_scan in config.yaml.
optional_env:
  - name: SKILLSPECTOR_MODEL
    description: >-
      Optional model override for the host LLM pass. Leave unset to use whatever
      model the Hermes agent is currently configured with. Forwarding the
      override to the host requires allow_model_override in this plugin's
      config.yaml llm block; without it the scan degrades to the host default.

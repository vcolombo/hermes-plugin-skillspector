name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install pytest ruff
      - name: Lint
        run: |
          ruff check skillspector_hermes tests
          ruff format --check skillspector_hermes tests
      - name: Test (hermetic — no SkillSpector install required)
        run: pytest -q
